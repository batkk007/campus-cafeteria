<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Bites - Feedback</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
    <header>
        <div class="logo">Campus Bites</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="deals.html">Deals</a></li>
                <li><a href="order.html">How to Order</a></li>
                <li><a href="feedback.html" class="active">Feedback</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1>Feedback & Contact Us</h1>
        <p>We value your thoughts! Please leave your feedback or contact details below.</p>
        
        <form class="feedback-form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required placeholder="Enter your name">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email">

            <label for="comments">Comments / Feedback:</label>
            <textarea id="comments" name="comments" rows="5" required placeholder="Your suggestions or feedback..."></textarea>

            <button type="submit">Submit Feedback</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Campus Bites Cafeteria | DevOps Fundamentals Assignment</p>
    </footer>
</body>
</html>
